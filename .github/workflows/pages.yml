name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; no cancelamos una que ya esté corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Preparar artefacto
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # El sitio es estático: no hay paso de compilación.
      # Las imágenes de assets/img/ se generan en local con `npm run images`
      # y se suben al repositorio ya listas.
      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
